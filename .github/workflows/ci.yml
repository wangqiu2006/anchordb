name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check clippy (default workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check clippy (mode-server)
        run: cargo clippy -p anchordb --features mode-server --all-targets -- -D warnings

      - name: Check bare-metal no_std (mode-mcu)
        run: cargo check -p hal_vfs -p kv_core -p anchordb --no-default-features --features mode-mcu --target thumbv7em-none-eabihf

      - name: Test mode-embedded
        run: cargo test -p anchordb --no-default-features --features mode-embedded

      - name: Test mode-server
        run: cargo test -p anchordb --features mode-server

      - name: Test full workspace
        run: cargo test --workspace
