[workspace]
resolver = "2"
members = [
    "crates/hal_vfs",
    "crates/kv_core",
    "crates/table_codec",
    "crates/query_engine",
    "crates/server_net",
    "crates/anchordb",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.100.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
